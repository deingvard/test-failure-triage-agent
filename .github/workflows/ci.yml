name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm:
        description: "Also evaluate the LLM classifier (needs the ANTHROPIC_API_KEY secret, costs API tokens)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests (includes dataset quality gates)
        run: mvn -B verify

      - name: Evaluate rule baseline
        run: java -jar target/triage.jar evaluate data/dataset.jsonl --classifier rules

      - name: Triage the sample JUnit report
        run: java -jar target/triage.jar report data/sample-report --history data/sample-report/history.json

      - name: Publish evaluation to the job summary
        run: cat results/evaluation-rules.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate LLM classifier
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llm }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          java -jar target/triage.jar evaluate data/dataset.jsonl --classifier llm
          cat results/evaluation-llm.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-results
          path: |
            results/
            target/surefire-reports/
